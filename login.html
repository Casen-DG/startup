<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellSim Live - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <a id="brand" class="navbar-brand" href="index.html">
          CellSim Live <span class="badge-crisis">BALANCE VS CRISIS</span>
        </a>
        <ul class="navbar-nav ms-auto flex-row gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="log.html">Log</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="panel auth-card">
        <h2>Welcome back</h2>
        <p class="muted">Log in to continue your simulation</p>
        <form>
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control mb-3" placeholder="you@example.com" />
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control mb-4" placeholder="••••••••" />
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-keeper flex-fill">Log In</button>
            <button type="button" class="btn btn-outline-keeper flex-fill">Create Account</button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <span>Dingxi Gu</span>
      <a href="https://github.com/Casen-DG/startup">GitHub</a>
    </footer>
  </body>
</html>
