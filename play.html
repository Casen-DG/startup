<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellSim Live - Simulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <a id="brand" class="navbar-brand" href="index.html">
          CellSim Live <span class="badge-crisis">BALANCE VS CRISIS</span>
        </a>
        <ul class="navbar-nav ms-auto flex-row gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="log.html">Log</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- 顶部：平衡度条和倒计时 -->
      <section class="status-bar">
        <div class="meter">
          <div class="meter-label">
            <span>Homeostasis Level</span>
            <span class="text-danger">41%</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" style="width:41%"></div>
          </div>
        </div>
        <div class="timer">
          <small>RESTABILIZE IN</small>
          <span id="countdown">00:32</span>
        </div>
      </section>

      <!-- 主体：两个玩家面板夹着网格 -->
      <section class="game-layout">
        <div class="player-card keeper">
          <h3>Player 1</h3>
          <p class="role">Balance Keeper</p>
          <button class="btn btn-keeper w-100 mb-2">Boost Immunity</button>
          <button class="btn btn-outline-keeper w-100">Repair Tissue</button>
        </div>

        <div class="cell-grid">
          <!-- 第 1 行 -->
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell"><span class="toxin"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <!-- 第 2 行 -->
          <div class="cell"></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="toxin"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <!-- 第 3 行 -->
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell"></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="toxin"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <!-- 第 4 行 -->
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="toxin"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"></div>
          <!-- 第 5 行 -->
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell"><span class="toxin"></span></div>
          <!-- 第 6 行 -->
          <div class="cell"></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="immune"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
          <div class="cell"><span class="healthy"></span></div>
          <div class="cell"><span class="toxin"></span></div>
          <div class="cell infected"><span class="pathogen"></span></div>
        </div>

        <div class="player-card invader">
          <h3>Player 2</h3>
          <p class="role">Invader</p>
          <button class="btn btn-invader w-100 mb-2">Release Pathogen</button>
          <button class="btn btn-outline-invader w-100">Spread Toxin</button>
        </div>
      </section>

      <p class="hint">Restore homeostasis before the timer runs out!</p>
    </main>

    <footer>
      <span>Dingxi Gu</span>
      <a href="https://github.com/Casen-DG/startup">GitHub</a>
    </footer>
  </body>
</html>
