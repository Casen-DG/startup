<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellSim Live - Simulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <a id="brand" class="navbar-brand" href="index.html">
          CellSim Live <span class="badge-crisis">BALANCE VS CRISIS</span>
        </a>
        <ul class="navbar-nav ms-auto flex-row gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="log.html">Log</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Tissue Sample #12 &mdash; Patient Specimen</h2>
      <p>96 cells &middot; tick 214</p>

      <!-- Application data placeholder: the simulation grid -->
      <img src="images/Main.png" alt="Simulation grid showing healthy, immune, and repair cells" width="500" />

      <h3>Regulatory Controls</h3>
      <form>
        <label>
          Healthy Cells
          <input type="range" min="0" max="100" value="62" />
        </label>
        <br />
        <label>
          Immune Cells
          <input type="range" min="0" max="100" value="28" />
        </label>
        <br />
        <label>
          Repair Cells
          <input type="range" min="0" max="100" value="18" />
        </label>
        <br />
        <button type="button">Start Simulation</button>
        <button type="button">Save Configuration</button>
      </form>

      <hr />

      <h3>Legend</h3>
      <ul>
        <li>&#9679; Healthy Cell</li>
        <li>&#9650; Immune Cell</li>
        <li>&#9670; Repair Cell</li>
      </ul>

      <hr />

      <!-- WebSocket placeholder -->
      <h3>Live activity</h3>
      <textarea rows="4" cols="50" readonly>
[placeholder] Homeostasis level: 78%.
[placeholder] A repair cell was spawned at tick 214.
      </textarea>
    </main>

    <footer>
      <span>Dingxi Gu</span>
      <a href="https://github.com/Casen-DG/startup">GitHub</a>
    </footer>
  </body>
</html>
