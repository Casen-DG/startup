<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellSim Live - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <a id="brand" class="navbar-brand" href="index.html">
          CellSim Live <span class="badge-crisis">BALANCE VS CRISIS</span>
        </a>
        <ul class="navbar-nav ms-auto flex-row gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="log.html">Log</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Settings</h2>
      <p>Adjust audio, display, and simulation preferences.</p>

      <form>
        <h3>Audio</h3>
        <label>
          Master Volume
          <input type="range" min="0" max="100" value="80" />
        </label>
        <br />
        <label>
          Music
          <input type="checkbox" checked />
        </label>
        <br />
        <label>
          Sound Effects
          <input type="checkbox" checked />
        </label>

        <hr />

        <h3>Display</h3>
        <label>
          Graphics Quality
          <select>
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
        </label>
        <br />
        <label>
          Theme
          <select>
            <option selected>Dark</option>
            <option>Light</option>
          </select>
        </label>
        <br />
        <label>
          Fullscreen
          <input type="checkbox" />
        </label>

        <hr />

        <h3>Simulation</h3>
        <label>
          Simulation Speed
          <select>
            <option>0.5x</option>
            <option selected>1x</option>
            <option>2x</option>
            <option>4x</option>
          </select>
        </label>
        <br />
        <label>
          Auto-save every tick
          <input type="checkbox" checked />
        </label>

        <hr />

        <button type="submit">Save Settings</button>
        <button type="reset">Reset to Defaults</button>
      </form>
    </main>

    <footer>
      <span>Dingxi Gu</span>
      <a href="https://github.com/Casen-DG/startup">GitHub</a>
    </footer>
  </body>
</html>
