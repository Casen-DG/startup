<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellSim Live - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark">
        <a id="brand" class="navbar-brand" href="index.html">
          CellSim Live <span class="badge-crisis">BALANCE VS CRISIS</span>
        </a>
        <ul class="navbar-nav ms-auto flex-row gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="log.html">Log</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="panel auth-card">
        <h2>Simulation Settings</h2>
        <form>
          <label for="healthy" class="form-label">Healthy cells</label>
          <input id="healthy" type="range" class="form-range mb-3" value="60" />
          <label for="immune" class="form-label">Immune cells</label>
          <input id="immune" type="range" class="form-range mb-3" value="30" />
          <label for="speed" class="form-label">Tick speed</label>
          <select id="speed" class="form-select mb-4">
            <option>Slow</option>
            <option selected>Normal</option>
            <option>Fast</option>
          </select>
          <button type="submit" class="btn btn-keeper w-100">Save Configuration</button>
        </form>
      </section>
    </main>

    <footer>
      <span>Dingxi Gu</span>
      <a href="https://github.com/Casen-DG/startup">GitHub</a>
    </footer>
  </body>
</html>
